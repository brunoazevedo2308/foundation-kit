name: E2E Authenticated

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dp-suite-e2e-authenticated
  cancel-in-progress: false

jobs:
  authenticated-flows:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    env:
      CI: "true"
      VITE_APP_ENV: staging
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      E2E_MEMBER_EMAIL: ${{ secrets.E2E_MEMBER_EMAIL }}
      E2E_MEMBER_PASSWORD: ${{ secrets.E2E_MEMBER_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Validate E2E secrets and staging target
        shell: bash
        run: |
          test "$VITE_SUPABASE_URL" = "https://ggehwncqjetinynwlqhj.supabase.co"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          test -n "$E2E_MEMBER_EMAIL"
          test -n "$E2E_MEMBER_PASSWORD"
          test -n "$E2E_ADMIN_EMAIL"
          test -n "$E2E_ADMIN_PASSWORD"

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:authenticated

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-authenticated-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
