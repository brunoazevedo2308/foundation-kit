name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and generate routes
        run: bun run build > /tmp/build.log 2>&1 || (cat /tmp/build.log && exit 1)

      - name: Typecheck
        id: typecheck
        shell: bash
        run: |
          bun run typecheck > typecheck.log 2>&1

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            typecheck.log
            /tmp/build.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test
