name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and generate routes
        shell: bash
        run: |
          set +e
          bun run build > /tmp/build.log 2>&1
          echo "$?" > /tmp/build.exit
          exit 0

      - name: Capture typecheck diagnostics
        shell: bash
        run: |
          set +e
          bun run typecheck > /tmp/typecheck.log 2>&1
          echo "$?" > /tmp/typecheck.exit
          exit 0

      - name: Capture lint diagnostics
        shell: bash
        run: |
          set +e
          bun run lint > /tmp/lint.log 2>&1
          echo "$?" > /tmp/lint.exit
          exit 0

      - name: Capture test diagnostics
        shell: bash
        run: |
          set +e
          bun run test > /tmp/test.log 2>&1
          echo "$?" > /tmp/test.exit
          exit 0

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            /tmp/*.log
            /tmp/*.exit
          if-no-files-found: error
          retention-days: 1

      - name: Enforce quality gate
        shell: bash
        run: |
          failed=0
          for check in build typecheck lint test; do
            if [ "$(cat /tmp/${check}.exit)" != "0" ]; then
              echo "::error title=${check} failed::See diagnostics below"
              cat "/tmp/${check}.log"
              failed=1
            fi
          done
          exit "$failed"
