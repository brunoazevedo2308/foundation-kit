name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and generate routes
        run: bun run build > /tmp/build.log 2>&1 || (cat /tmp/build.log && exit 1)

      - name: Typecheck
        shell: bash
        run: |
          if ! bun run typecheck > /tmp/typecheck.log 2>&1; then
            cat /tmp/typecheck.log
            exit 1
          fi

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test
