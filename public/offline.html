<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#061b3a" />
    <title>DP Suite — Sem conexão</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 1.5rem;
      }
      main {
        width: min(100%, 28rem);
        text-align: center;
      }
      img {
        width: 5rem;
        height: 5rem;
        border-radius: 1.25rem;
      }
      h1 {
        margin: 1.5rem 0 0.5rem;
        font-size: 1.5rem;
      }
      p {
        margin: 0;
        color: #475569;
        line-height: 1.6;
      }
      button {
        margin-top: 1.5rem;
        border: 0;
        border-radius: 0.625rem;
        background: #061b3a;
        color: white;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
        padding: 0.75rem 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" width="80" height="80" />
      <h1>Você está sem conexão</h1>
      <p>
        O DP Suite não armazena páginas ou dados autenticados para uso offline. Reconecte-se à
        internet para acessar informações atualizadas.
      </p>
      <button type="button" onclick="window.location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
